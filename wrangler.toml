name = "sso-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sso-bot-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
# تنظیمات عمومی (بهتر است BOT_TOKEN به صورت secret تنظیم شود)
LOG_LEVEL = "info"
